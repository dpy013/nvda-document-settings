[project]
name = "nvda-document-settings"
version = "0.1.0"
description = "Prototype NVDA add-on for document formatting settings."
requires-python = ">=3.11"
dependencies = [
	"scons>=4.10",
]

[dependency-groups]
dev = [
	"ruff>=0.16",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["documentFormattingTreePrototype.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E731", "W191"]

[tool.ruff.format]
indent-style = "tab"
quote-style = "double"


