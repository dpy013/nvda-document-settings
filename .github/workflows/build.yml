name: Build

on:
  release:
    types:
      - published
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build:
    name: Build add-on
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13.15'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Set build channel
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'release') {
            "ADDON_CHANNEL=stable" | Out-File -FilePath $env:GITHUB_ENV -Append
          } elseif ('${{ github.event_name }}' -eq 'pull_request') {
            "ADDON_CHANNEL=pr" | Out-File -FilePath $env:GITHUB_ENV -Append
            "PR_NUMBER=${{ github.event.pull_request.number }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          } elseif ('${{ github.ref_name }}' -eq 'main') {
            "ADDON_CHANNEL=test" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "ADDON_CHANNEL=dev" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Configure build environment
        shell: pwsh
        run: .\scons.bat configure

      - name: Update download links
        shell: pwsh
        run: python scripts\update_download_links.py

      - name: Check formatting and linting
        shell: pwsh
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Build add-on
        shell: pwsh
        run: .\scons.bat building

      - name: Generate localization template
        shell: pwsh
        run: .\scons.bat pot

      - name: Generate user guide
        shell: pwsh
        run: .\scons.bat document

      - name: Upload add-on package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nvda-document-settings-${{ env.ADDON_CHANNEL }}
          path: documentFormattingTree-*.nvda-addon

      - name: Upload generated documents
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nvda-document-settings-generated-files
          path: |
            locale/documentFormattingTree.pot
            build/userGuide.md
