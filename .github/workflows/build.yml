name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build:
    name: Build add-on
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Configure build environment
        shell: pwsh
        run: .\scons.bat configure

      - name: Check formatting and linting
        shell: pwsh
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Build add-on
        shell: pwsh
        run: .\scons.bat building

      - name: Generate localization template
        shell: pwsh
        run: .\scons.bat pot

      - name: Generate user guide
        shell: pwsh
        run: .\scons.bat document

      - name: Upload add-on package
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nvda-document-settings-addon
          path: documentFormattingTree-0.1.0.nvda-addon

      - name: Upload generated documents
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nvda-document-settings-generated-files
          path: |
            locale/documentFormattingTree.pot
            build/userGuide.md
